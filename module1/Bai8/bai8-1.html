<html>
<head>
    <title>JS</title>
</head>
<body>
    <table border="1" width="400">
        <thead>
            <tr>
                <th><input type="checkbox" id="checkAll" onchange="toggleCheckAll(this)" /></th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Hình ảnh</th>
            </tr>
        </thead>
        <tbody id="cart-table"></tbody>
    </table>

    <button onclick="clearAll()">Xóa hết giỏ hàng</button>
    <button onclick="deleteSelected()">Xóa hết kết quả được chọn</button>
    <script>
        // Tạo dữ liệu giỏ hàng
        var cart =[
            { name: "iphone 15", price: 1500, qty: 1, image: "img/iphone15.jpg", checked:false},
            { name: "Xiaomi 14", price: 25, qty: 1, image: "img/xiaomi14.png", checked:false},
            { name: "Xiaomi 14", price: 70, qty: 1, image: "img/xiaomi14.png", checked:false}
       ]; 

        if (localStorage.getItem('cart') == null) {   
         // // Lưu vào localStorage
         localStorage.setItem("cart", JSON.stringify(cart));
        }

        if(localStorage.getItem("cart")==null){
            localStorage.setItem("cart", JSON.stringify(cart))
        }

        var cartData = JSON.parse(localStorage.getItem("cart")) || [];
        // Lấy dữ liệu ra
        function saveCart(){
            localStorage.setItem("cart", JSON.stringify(cart));
        }
        saveCart();
        function clearAll() {
            localStorage.clear();
        }
        function renderCart(){
            var tableBody = document.getElementById("cart-table");
            let html ="";
            cartData.forEach((item, index) => {
                html += 
                `<tr>
                    <td>
                        <input type ="checkbox" ${item.checked ? "checked": ""} 
                        onchange="toggleItem(${index}, this.checked)"/>
                    </td>
                    <td>${item.name}</td>
                    <td>${item.price}</td>
                    <td><input type="number" name="qty" onchange="updateQty(${index}, this.value)" value="${item.qty}" /></td>
                    <td><center><img src=${item.image} width="50%" /></center></td>
                </tr> `;
            }); 
            tableBody.innerHTML = html;
        }
        renderCart()

        function toggleItem(index, checked){
            cart[index].checked = checked;
            saveCart();
        }

        function toggleCheckAll(checkbox){
            cart.forEach(item =>{item.checked = checkbox.checked});
            saveCart();
            console.log(cart)            
            renderCart();
        }

        function updateQty(index, newQty){
            cart[index].qty = Number(newQty);
            localStorage.clear();
            localStorage.setItem("cart", JSON.stringify(cart));
            console.log(index);
            console.log(cart[index].qty);
            console.log(localStorage.getItem("cart"));
        }
        
        function deleteSelected(){
            cart = cart.filter(item=> item.checked === false);
            saveCart();
            renderCart();
        }
        
    </script> 

</body>
</html>
