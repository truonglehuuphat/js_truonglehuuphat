<!-- <!DOCTYPE html> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Shopping Cart</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody id ="cart-table"></tbody>
    </table>
    <button onclick="clearAll()">Xoa het gio hang</button>
<script>
    function initData(){
        if(!localStorage.getItem("cart")){
        var cart=[
            {name:"laptop", price: 1500, qty:1},
            {name:"camera", price: 2500, qty:1},
            {name:"iphone", price: 3500, qty:1}
        ];
        localStorage.setItem("cart", JSON.stringify(cart));
        };
    }


    function renderCart(){
        var cartData = JSON.parse(localStorage.getItem("cart"))||[];
        console.log(localStorage.getItem("cart"))

        var tableBody = document.getElementById("cart-table");
        let html = "";

        cartData.forEach(item=>{
            html += `<tr>
                <td>${item.name}</td>
                <td>${item.price}</td>
                <td>${item.qty}</td>
                </tr>`;
        });
        tableBody.innerHTML = html;
    }
    

    function clearAll(){
        localStorage.removeItem("cart");
        renderCart();
    }
    initData();
    renderCart();
</script>    
</body>

</html>
