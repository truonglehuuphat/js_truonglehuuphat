<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="batDongBo()">Chạy bất đồng bộ</button>
    <div id="step">
       
    </div>
    <script>

            function batDongBo(){
                setTimeout(()=> {
                    document.getElementById("step").innerHTML = "Buoc 2";
                }, 4000);
                setTimeout(()=> {
                    document.getElementById("step").innerHTML = "Buoc 3";
                }, 3000);
                document.getElementById("step").innerHTML = "Buoc 1";
            }
    </script>
</body>
</html>
