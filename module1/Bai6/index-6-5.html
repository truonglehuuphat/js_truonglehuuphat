<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class ="container mt-4">
        <h2>Danh sach dien thoai</h2>
        <select class="form-select w-25 md-3" onchange="sortProducts(this.value)">
            <option value="asc">Gia tang dan</option>
            <option value="desc">Gia giam dan</option>
        </select>
        <div class="row" id="product-list"></div>
    </div>
    
    <script>
        let products = [];
        window.onload = function(){
            loadProducts();
        }
        function loadProducts(){
            let xhr = new XMLHttpRequest();
            xhr.open("GET", "products.json", true);
            xhr.onload = function(){
                if(xhr.status == 200){
                    products = JSON.parse(xhr.responseText);
                    renderProducts(products);
                }
            };
            xhr.send();
        }

        function renderProducts(list){
            let html = "";
            list.forEach(product => {
                html += `
                <div class="col md 4">
                    <div class="card mb-3">
                        <img src = "${product.img}" class="card-img-top width=100px" />
                        <div class="card-body">
                            <h5>${product.name}</h5>
                            <p>${product.price} VND </p>
                        </div>
                    </div>
                </div>
                `
            });
            document.getElementById("product-list").innerHTML = html;
        }

    function sortProducts(type){
        if(type==="asc"){
            products.sort((a,b)=> a.price - b.price);
        } else {
            products.sort((a,b)=> b.price - a.price);
        }
        renderProducts(products);
    }
    </script>
</body>
</html>
