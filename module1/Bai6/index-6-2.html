<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h3 id="message">Chao moi nguoi </h3>
    <button onclick="doiMau()">Doi mau</button>
    <button onclick="inNoiDung()">In Noi dung</button>
    <button onclick="inNoiDungCu()">Quay lai noi dung cu</button>

    <script>
        function doiMau(){
            var element = document.getElementById("message");
            if(element.style.color == 'blue'){
                element.style.color = 'red';
            } else {
                element.style.color = 'blue';
            }
        }

        function inNoiDung(){
            document.getElementById("message").innerHTML = "Chao ta ca moi nguoi";
        }

        function inNoiDungCu(){
            document.getElementById("message").innerHTML ="Chao moi nguoi";
        }
    </script>
</body>
</html>
